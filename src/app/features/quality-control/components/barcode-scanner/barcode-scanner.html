<div class="barcode-scanner" role="dialog" aria-modal="true" aria-labelledby="barcode-scanner-title">
  <section class="barcode-scanner__panel">
    <header class="barcode-scanner__header">
      <div>
        <h2 id="barcode-scanner-title">Ler código da Ordem</h2>
        <p>Aponte a câmera para o código de barras ou QR Code.</p>
      </div>
      <po-button
        p-icon="an an-x"
        p-label="Fechar"
        (p-click)="scanCancelled.emit()"
      ></po-button>
    </header>

    <div class="barcode-scanner__viewport">
      <video #preview autoplay muted playsinline aria-label="Imagem da câmera"></video>
      <span aria-hidden="true"></span>
    </div>
  </section>
</div>
