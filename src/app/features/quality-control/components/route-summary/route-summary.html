<dl class="route-summary" aria-label="Resumo do roteiro de inspeção">
  <div>
    <dt>Roteiro</dt>
    <dd>{{ route().routeNumber }}</dd>
  </div>

  <div>
    <dt>Processo</dt>
    <dd>{{ route().processDescription }}</dd>
  </div>

  <div>
    <dt>Ordem atual</dt>
    <dd>{{ route().currentOrder }}</dd>
  </div>

  <div>
    <dt>Operação</dt>
    <dd>{{ route().operationDescription }}</dd>
  </div>

  <div>
    <dt>Split</dt>
    <dd>{{ route().split }}</dd>
  </div>

  <div>
    <dt>Item</dt>
    <dd>{{ route().itemCode }}</dd>
  </div>

  <div>
    <dt>Descrição</dt>
    <dd>{{ route().itemDescription }}</dd>
  </div>
</dl>
