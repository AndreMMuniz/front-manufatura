<form class="reaction-plan-authorization-form" (ngSubmit)="authorize()">
  <h3>Plano de Reação</h3>
  <p>
    A medição está fora da tolerância. Informe a autorização do supervisor para liberar
    a continuidade do processo.
  </p>

  <po-input
    name="supervisorId"
    p-label="Supervisor"
    p-placeholder="Código ou usuário do supervisor"
    p-required="true"
    [ngModel]="supervisorId"
    (ngModelChange)="supervisorIdChange.emit($event)"
  ></po-input>

  <po-input
    name="supervisorPassword"
    p-label="Senha"
    p-placeholder="Senha de liberação"
    p-required="true"
    p-secret="true"
    [ngModel]="supervisorPassword"
    (ngModelChange)="supervisorPasswordChange.emit($event)"
  ></po-input>

  <po-input
    name="authorizationReason"
    p-label="Motivo / ação tomada"
    p-required="true"
    [ngModel]="authorizationReason"
    (ngModelChange)="authorizationReasonChange.emit($event)"
  ></po-input>

  <po-button
    p-label="Autorizar plano de reação"
    p-kind="primary"
    p-type="submit"
    [p-disabled]="!canAuthorize"
  ></po-button>
</form>
