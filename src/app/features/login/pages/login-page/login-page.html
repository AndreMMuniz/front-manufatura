<section class="login-page" aria-labelledby="login-title">
  <div class="login-page__panel">
    <header class="login-page__header">
      <div class="login-page__logo">
        <img src="assets/logo-cortag.png" alt="Cortag — Revolution Tools" />
      </div>
      <h1 id="login-title">Apontamento Manufatura</h1>
    </header>

    @if (isAuthenticated) {
      <p class="login-page__authenticated">
        Sessão ativa para <strong>{{ usuarioLogado?.login }}</strong>.
      </p>

      <po-button p-label="Sair" p-kind="secondary" (p-click)="logout()"></po-button>
    } @else {
      <form class="login-page__form" #loginForm="ngForm" (ngSubmit)="entrar()" novalidate>
        <po-login
          name="login"
          p-label="Login"
          p-placeholder="Informe seu login"
          [p-required]="true"
          [p-disabled]="submitting"
          [p-auto-focus]="true"
          p-error-message="Informe o login."
          [(ngModel)]="login"
        ></po-login>

        <po-password
          name="senha"
          p-label="Senha"
          p-placeholder="Informe sua senha"
          [p-required]="true"
          [p-disabled]="submitting"
          p-error-message="Informe a senha."
          [(ngModel)]="senha"
        ></po-password>

        @if (submitted && !canSubmit) {
          <p class="login-page__message" role="alert">{{ emptyFieldsMessage }}</p>
        }

        @if (feedback) {
          <p class="login-page__message" role="alert">{{ feedback }}</p>
        }

        @if (submitting) {
          <div class="login-page__loading" role="status" aria-live="polite">
            <po-loading p-text="Autenticando"></po-loading>
          </div>
        }

        <po-button
          class="login-page__submit"
          p-label="Entrar"
          p-kind="primary"
          p-type="submit"
          [p-disabled]="!canSubmit || submitting"
        ></po-button>
      </form>
    }
  </div>

  <footer class="login-page__version">Plano de Controle CQ</footer>
</section>
