<po-widget p-title="Responsável pela Parada">
  <div class="responsavel-parada">
    <po-select
      name="tipoResponsavelParada"
      p-label="Tipo de responsável"
      [p-options]="typeOptions"
      [p-disabled]="disabled || loading || responsibleTypeLocked"
      [ngModel]="responsibleType"
      (ngModelChange)="changeType($event)"
    ></po-select>

    @if (responsibleType === 'EQUIPE') {
      <po-select
        name="responsavelParada"
        p-label="Equipe"
        p-placeholder="Selecione a equipe"
        [p-options]="responsibleOptions"
        [p-disabled]="disabled || loading"
        [p-loading]="loading"
        [ngModel]="responsibleCode"
        (ngModelChange)="changeResponsible($event)"
      ></po-select>
    } @else {
      <po-input
        name="responsavelParada"
        p-label="Código do operador"
        [p-disabled]="disabled"
        [ngModel]="responsibleCode"
        (ngModelChange)="changeResponsible($event)"
      ></po-input>
    }
  </div>

  @if (loading) {
    <app-loading class="responsavel-parada__status" text="Carregando responsáveis e motivos..."></app-loading>
  } @else if (errorMessage) {
    <div class="responsavel-parada__error" role="alert">
      <span>{{ errorMessage }}</span>
      <po-button
        class="responsavel-parada__retry"
        p-label="Tentar novamente"
        p-kind="secondary"
        [p-disabled]="disabled"
        (p-click)="retry.emit()"
      ></po-button>
    </div>
  } @else if (responsibleType === 'EQUIPE' && responsibleOptions.length === 0) {
    <p class="responsavel-parada__empty" role="status">{{ emptyMessage }}</p>
  }
</po-widget>
