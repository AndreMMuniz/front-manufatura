<po-widget p-title="Contexto de Produção">
  <div class="contexto-producao">
    <po-select
      name="areaCode"
      p-label="Área de Produção"
      p-placeholder="Selecione a Área"
      [p-options]="areaOptions"
      [p-disabled]="disabled"
      [p-loading]="loadingAreas"
      [ngModel]="areaCode"
      (ngModelChange)="changeArea($event)"
    ></po-select>

    <po-select
      name="workCenterCode"
      p-label="Centro de Trabalho"
      p-placeholder="Selecione o Centro de Trabalho"
      [p-options]="centerOptions"
      [p-disabled]="centerDisabled"
      [p-loading]="loadingCenters"
      [ngModel]="workCenterCode"
      (ngModelChange)="changeWorkCenter($event)"
    ></po-select>

    @if (showAction) {
      <po-button
        class="contexto-producao__action"
        [p-label]="actionLabel"
        p-kind="primary"
        [p-disabled]="actionDisabled"
        [p-loading]="loadingAction"
        (p-click)="action.emit()"
      ></po-button>
    }
  </div>

  @if (loadingAction) {
    <div class="contexto-producao__status" role="status" aria-live="polite">
      <po-loading [p-text]="loadingText" p-size="sm"></po-loading>
    </div>
  }

  @if (errorMessage) {
    <div class="contexto-producao__error" role="alert">
      <span>{{ errorMessage }}</span>
      <po-button
        p-label="Tentar novamente"
        p-kind="secondary"
        (p-click)="retry.emit()"
      ></po-button>
    </div>
  }
</po-widget>
