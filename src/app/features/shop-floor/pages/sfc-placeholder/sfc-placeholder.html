<po-page-default [p-title]="title">
  <section class="sfc-placeholder">
    <po-widget [p-title]="title">
      <div class="sfc-placeholder__content">
        <p class="sfc-placeholder__message">
          Este modulo esta pendente de implementacao. Use o Menu Principal para acessar os fluxos disponiveis.
        </p>
        <p class="sfc-placeholder__description">{{ description }}</p>
        <po-button p-label="Voltar ao Menu" p-kind="secondary" p-type="button" (p-click)="backToMenu()"></po-button>
      </div>
    </po-widget>
  </section>
</po-page-default>
