<po-page-default [p-title]="title">
  <section class="sfc-placeholder">
    <po-widget>
      <div class="sfc-placeholder__content">
        @if (unavailableMessage) {
          <p class="sfc-placeholder__availability" role="status" aria-live="polite">
            {{ unavailableMessage }}
          </p>
        }
        <p class="sfc-placeholder__message">
          Este módulo está pendente de implementação. Use o menu lateral para acessar os fluxos disponíveis.
        </p>
        <p class="sfc-placeholder__description">{{ description }}</p>
        <po-button
          p-label="Voltar ao Plano Controle CQ"
          p-kind="secondary"
          p-type="button"
          (p-click)="backToDefaultModule()"
        ></po-button>
      </div>
    </po-widget>
  </section>
</po-page-default>
