<po-page-default [p-title]="pageTitle">
  <section class="report-operacao">
    <app-operational-correction-notice />
    <app-contexto-producao-selector
      [areas]="areas"
      [centers]="centers"
      [areaCode]="areaCode"
      [workCenterCode]="workCenterCode"
      [loadingAreas]="loadingAreas"
      [loadingCenters]="loadingCenters"
      [loadingAction]="loadingOrders"
      [disabled]="isBusy"
      [consultBlocked]="hasActiveWorkflow"
      [errorMessage]="contextError"
      [recentContexts]="recentContexts"
      (areaChange)="onAreaInput($event)"
      (areaValidate)="validateArea($event)"
      (workCenterChange)="onWorkCenterChange($event)"
      (recentContextSelect)="selectRecentContext($event)"
      (action)="consultOrders()"
      (retry)="retryContext()"
    ></app-contexto-producao-selector>

    <app-ordens-centro-list
      [orders]="orders"
      [selectedIds]="selectedOrderIds"
      [loading]="loadingOrders"
      [disabled]="isBusy"
      [showList]="showOrderList"
      (selectionChange)="updateSelection($event)"
      (open)="openSelectedOrders()"
    ></app-ordens-centro-list>

    @if (loadingOperation) {
      <app-loading text="Carregando ordem selecionada..."></app-loading>
    }

    @if (operacao) {
      <p class="report-operacao__queue" aria-live="polite">
        Ordem ativa {{ operacao.ordem }} · {{ queueRemaining }} ordem(ns) na fila
      </p>

      <app-op-detalhes-card [operacao]="operacao"></app-op-detalhes-card>

      <app-producao-form
        [operacao]="operacao"
        [dataInicio]="dataInicioSelecionada"
        [horaInicio]="horaInicioSelecionada"
        [inicioDisabled]="operacao.dataInicio !== undefined || isBusy"
        (dataInicioChange)="alterarDataInicio($event)"
        (horaInicioChange)="alterarHoraInicio($event)"
      ></app-producao-form>

      <app-operacao-info-card
        [operacao]="operacao"
        [responsaveis]="responsaveis"
        [tipoResponsavel]="tipoResponsavel"
        [responsavelCodigo]="responsavelCodigo"
        [tipoResponsavelDisabled]="tipoResponsavelDefinidoPelaApi || operacao.dataInicio !== undefined || isBusy"
        [responsavelDisabled]="responsavelDisabled"
        [loadingResponsaveis]="loadingResponsaveis"
        [responsaveisError]="responsaveisError"
        [gerenciarEquipeDisabled]="!canManageTeam"
        (tipoResponsavelChange)="alterarTipoResponsavel($event)"
        (responsavelChange)="alterarResponsavel($event)"
        (responsavelConfirmado)="confirmarResponsavel()"
        (retryResponsaveis)="retryResponsaveis()"
        (gerenciarEquipe)="abrirGerenciarEquipe($event)"
      ></app-operacao-info-card>

    }

    <app-report-actions
      [iniciarDisabled]="iniciarDisabled"
      [iniciarLoading]="estado === 'Carregando' && !operacao?.dataInicio"
      [reporteDisabled]="reporteDisabled"
      [reporteLoading]="estado === 'Reportando' && !encerrando"
      (iniciar)="iniciarOperacao()"
      (reporte)="abrirReporte()"
    ></app-report-actions>

    <p class="report-operacao__feedback" role="status" aria-live="polite" [class.report-operacao__feedback--error]="consultaEstado === 'erro' || estado === 'Erro'">
      {{ feedback }}
    </p>

    <app-reporte-slide
      [ordem]="operacao?.ordem ?? ''"
      (reporteSolicitado)="salvarReporte($event)"
    ></app-reporte-slide>

    <app-gerenciar-equipe-slide
      (equipeSalva)="onEquipeSalva($event)"
    ></app-gerenciar-equipe-slide>
  </section>
</po-page-default>
