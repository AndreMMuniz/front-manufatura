<po-page-default [p-title]="pageTitle">
  <section class="report-operacao">
    <app-contexto-producao-card
      [areas]="areas"
      [centers]="centers"
      [areaCode]="areaCode"
      [workCenterCode]="workCenterCode"
      [loadingAreas]="loadingAreas"
      [loadingCenters]="loadingCenters"
      [loadingOrders]="loadingOrders"
      [disabled]="isBusy || hasActiveWorkflow"
      [errorMessage]="contextError"
      (areaChange)="onAreaChange($event)"
      (workCenterChange)="onWorkCenterChange($event)"
      (consult)="consultOrders()"
      (retry)="retryContext()"
    ></app-contexto-producao-card>

    <app-ordens-centro-list
      [orders]="orders"
      [selectedIds]="selectedOrderIds"
      [loading]="loadingOrders"
      [disabled]="isBusy"
      [showList]="showOrderList"
      (selectionChange)="updateSelection($event)"
      (open)="openSelectedOrders()"
    ></app-ordens-centro-list>

    @if (loadingOperation) {
      <div class="report-operacao__loading" role="status">
        <po-loading p-text="Carregando ordem selecionada..." p-size="md"></po-loading>
      </div>
    }

    @if (operacao) {
      <p class="report-operacao__queue" aria-live="polite">
        Ordem ativa {{ operacao.ordem }} · {{ queueRemaining }} ordem(ns) na fila
      </p>

      <app-op-detalhes-card [operacao]="operacao"></app-op-detalhes-card>

      <app-producao-form
        [operacao]="operacao"
        [disabled]="!canEditProduction"
        [refugoDisabled]="!canOpenAuxiliaryFlows"
        [retrabalhoDisabled]="!canOpenAuxiliaryFlows"
        (producaoChange)="atualizarProducao($event)"
        (editarRefugo)="abrirRefugo()"
        (editarRetrabalho)="abrirRetrabalho()"
      ></app-producao-form>

      <app-operacao-info-card [operacao]="operacao"></app-operacao-info-card>

      <app-report-actions
        [primaryLabel]="primaryLabel"
        [primaryDisabled]="primaryDisabled"
        [primaryLoading]="estado === 'Reportando'"
        [paradaDisabled]="!canOpenAuxiliaryFlows"
        (primaryAction)="executePrimaryAction()"
        (parada)="abrirParada()"
        (voltar)="voltar()"
        (sair)="sair()"
      ></app-report-actions>
    }

    <p class="report-operacao__feedback" [class.report-operacao__feedback--error]="consultaEstado === 'erro' || estado === 'Erro'">
      {{ feedback }}
    </p>

    <app-refugo-slide
      (refugoRegistrado)="registrarRefugo($event)"
      (sairSolicitado)="sair()"
    ></app-refugo-slide>
  </section>
</po-page-default>
