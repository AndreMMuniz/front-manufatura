<po-widget p-title="Ações da Operação">
  <div class="report-actions">
    <po-button
      p-label="Iniciar"
      p-kind="primary"
      [p-loading]="iniciarLoading"
      [p-disabled]="iniciarDisabled"
      (p-click)="iniciar.emit()"
    ></po-button>

    <po-button
      p-label="Reporte"
      p-kind="secondary"
      [p-loading]="reporteLoading"
      [p-disabled]="reporteDisabled"
      (p-click)="reporte.emit()"
    ></po-button>

    <po-button
      p-label="Encerrar"
      p-kind="secondary"
      [p-disabled]="encerrarDisabled"
      (p-click)="encerrar.emit()"
    ></po-button>
  </div>
</po-widget>
