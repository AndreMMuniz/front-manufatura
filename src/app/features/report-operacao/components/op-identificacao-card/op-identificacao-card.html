<po-widget p-title="Identificação da OP">
  <form class="op-identificacao" (ngSubmit)="onSubmit()">
    <po-input
      name="ordem"
      p-label="Ordem"
      p-placeholder="Ex.: 450001"
      p-required="true"
      [p-disabled]="disabled"
      [ngModel]="ordem"
      (ngModelChange)="ordemChange.emit($event)"
    ></po-input>

    <po-input
      name="op"
      p-label="OP"
      p-placeholder="Ex.: OP-10458"
      p-required="true"
      [p-disabled]="disabled"
      [ngModel]="op"
      (ngModelChange)="opChange.emit($event)"
    ></po-input>

    <po-input
      name="split"
      p-label="Split"
      p-placeholder="Ex.: 01"
      [p-disabled]="disabled"
      [ngModel]="split"
      (ngModelChange)="splitChange.emit($event)"
    ></po-input>

    <div class="op-identificacao__actions">
      <po-button
        p-label="Scanner"
        p-kind="secondary"
        p-type="button"
        p-icon="po-icon-camera"
        [p-disabled]="disabled || loading"
        (p-click)="scanner.emit()"
      ></po-button>

      <po-button
        p-label="Consultar"
        p-kind="primary"
        p-type="submit"
        [p-loading]="loading"
        [p-disabled]="!canConsultar"
      ></po-button>
    </div>
  </form>
</po-widget>
