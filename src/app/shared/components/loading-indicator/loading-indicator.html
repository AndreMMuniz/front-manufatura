<div class="loading-indicator" role="status" aria-live="polite">
  <span class="loading-indicator__label">{{ text }}</span>
  <span
    class="loading-indicator__track"
    role="progressbar"
    [attr.aria-label]="text"
    aria-valuetext="Em andamento"
  >
    <span class="loading-indicator__bar"></span>
  </span>
</div>
