<div class="app-shell" [class.po-wrapper]="showSideMenu">
  @if (isAuthenticated) {
    <ng-template #sessionActionsIcon>
      <button
        type="button"
        class="app-shell__session-actions-trigger"
        aria-label="Abrir ações da sessão"
      >
        <po-icon p-icon="an an-sign-out" aria-hidden="true" />
      </button>
    </ng-template>

    <po-toolbar
      [p-title]="toolbarTitle"
      [p-actions]="toolbarActions"
      [p-actions-icon]="sessionActionsIcon"
    ></po-toolbar>

    @if (showSideMenu) {
      <nav class="app-shell__menu" aria-label="Menu lateral principal" data-testid="app-side-menu">
        <po-menu [p-menus]="menus"></po-menu>
      </nav>
    }
  }

  <main class="app-shell__content" data-testid="app-content">
    <router-outlet />
  </main>
</div>
