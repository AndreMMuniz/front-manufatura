<div class="app-shell">
  @if (isAuthenticated) {
    <ng-template #sessionActionsIcon>
      <button
        type="button"
        class="app-shell__session-actions-trigger"
        aria-label="Abrir ações da sessão"
      >
        <po-icon p-icon="an an-sign-out" aria-hidden="true" />
      </button>
    </ng-template>

    <po-toolbar
      [p-title]="toolbarTitle"
      [p-actions]="toolbarActions"
      [p-actions-icon]="sessionActionsIcon"
    ></po-toolbar>
  }

  <main class="app-shell__content" data-testid="app-content">
    @if (showMainMenuReturn) {
      <div class="app-shell__main-menu-bar">
        <a
          class="app-shell__main-menu-return"
          routerLink="/menu"
          data-testid="main-menu-return"
          aria-label="Voltar ao Menu Principal"
        >
          <po-icon p-icon="an an-house-line" aria-hidden="true" />
          <span>Menu Principal</span>
        </a>
      </div>
    }

    <router-outlet />
  </main>
</div>
